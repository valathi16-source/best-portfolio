<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <radialGradient id="aiGlowBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="70%" stop-color="#0a081a"/>
      <stop offset="100%" stop-color="#04030a"/>
    </radialGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="350" fill="url(#aiGlowBg)"/>

  <!-- Neural Network Constellation Lines -->
  <g stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4">
    <line x1="120" y1="100" x2="220" y2="70"/>
    <line x1="120" y1="100" x2="220" y2="175"/>
    <line x1="120" y1="250" x2="220" y2="175"/>
    <line x1="120" y1="250" x2="220" y2="280"/>
    <line x1="220" y1="70" x2="380" y2="100"/>
    <line x1="220" y1="175" x2="380" y2="100"/>
    <line x1="220" y1="175" x2="380" y2="250"/>
    <line x1="220" y1="280" x2="380" y2="250"/>
    <line x1="380" y1="100" x2="480" y2="175"/>
    <line x1="380" y1="250" x2="480" y2="175"/>
  </g>

  <!-- Neural Nodes -->
  <circle cx="120" cy="100" r="14" fill="#0c132c" stroke="#00f5ff" stroke-width="2.5" filter="url(#nodeGlow)"/>
  <circle cx="120" cy="250" r="14" fill="#0c132c" stroke="#00f5ff" stroke-width="2.5" filter="url(#nodeGlow)"/>
  
  <circle cx="220" cy="70" r="16" fill="#1b1236" stroke="#a855f7" stroke-width="2.5" filter="url(#nodeGlow)"/>
  <circle cx="220" cy="175" r="22" fill="#1b1236" stroke="#38bdf8" stroke-width="3" filter="url(#nodeGlow)"/>
  <circle cx="220" cy="280" r="16" fill="#1b1236" stroke="#a855f7" stroke-width="2.5" filter="url(#nodeGlow)"/>
  
  <circle cx="380" cy="100" r="18" fill="#1b1236" stroke="#a855f7" stroke-width="2.5" filter="url(#nodeGlow)"/>
  <circle cx="380" cy="250" r="18" fill="#1b1236" stroke="#a855f7" stroke-width="2.5" filter="url(#nodeGlow)"/>

  <!-- AI Center Brain / Core -->
  <circle cx="480" cy="175" r="30" fill="#0a1026" stroke="#00f5ff" stroke-width="3" filter="url(#nodeGlow)"/>
  <circle cx="480" cy="175" r="14" fill="#00f5ff" fill-opacity="0.6"/>

  <!-- Waveform Overlay at Bottom -->
  <path d="M 50,300 Q 150,260 250,300 T 450,300 T 550,280" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <text x="50" y="330" fill="#38bdf8" font-family="monospace" font-size="11">SPEECH-TO-TEXT // LLM INFERENCE ENGINE // AUDIO SYNTHESIS</text>
</svg>
