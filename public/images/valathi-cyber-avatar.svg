<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#cyberGlow)"/>

  <!-- Cyber Hexagon Outer Frame -->
  <polygon points="200,20 355,110 355,290 200,380 45,290 45,110" 
           fill="#0a1026" stroke="#00f5ff" stroke-width="3" stroke-opacity="0.8" filter="url(#shadowGlow)"/>

  <!-- Inner Tech Pattern Lines -->
  <polygon points="200,35 340,118 340,282 200,365 60,282 60,118" 
           fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.6"/>

  <!-- Cybernetic Silhouette / Avatar -->
  <!-- Shoulders / Cyber Armor -->
  <path d="M 110,340 C 120,290 150,270 200,270 C 250,270 280,290 290,340 Z" fill="#0f172a" stroke="#00f5ff" stroke-width="2"/>
  <path d="M 140,340 L 160,280 L 200,295 L 240,280 L 260,340" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Neck -->
  <rect x="185" y="230" width="30" height="45" rx="5" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>

  <!-- Head Base -->
  <path d="M 140,165 C 140,115 165,90 200,90 C 235,90 260,115 260,165 C 260,215 235,235 200,235 C 165,235 140,215 140,165 Z" 
        fill="#0f172a" stroke="#00f5ff" stroke-width="2"/>

  <!-- Glowing Cyber Visor -->
  <path d="M 145,150 L 255,150 L 250,175 L 200,185 L 150,175 Z" 
        fill="url(#visorGrad)" filter="url(#shadowGlow)"/>
  <line x1="150" y1="162" x2="250" y2="162" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9"/>

  <!-- Tech Nodes & Ear Gear -->
  <rect x="132" y="145" width="12" height="30" rx="3" fill="#00f5ff" opacity="0.9"/>
  <circle cx="138" cy="160" r="2" fill="#ffffff"/>
  <rect x="256" y="145" width="12" height="30" rx="3" fill="#a855f7" opacity="0.9"/>
  <circle cx="262" cy="160" r="2" fill="#ffffff"/>

  <!-- Circuit Accents -->
  <path d="M 70,110 L 110,110 L 130,130" fill="none" stroke="#00f5ff" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="70" cy="110" r="4" fill="#00f5ff"/>

  <path d="M 330,110 L 290,110 L 270,130" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="330" cy="110" r="4" fill="#a855f7"/>

  <path d="M 80,280 L 120,280 L 135,260" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="80" cy="280" r="4" fill="#10b981"/>

  <!-- Central "V" Hologram Chest Emblem -->
  <polygon points="190,305 200,325 210,305 205,305 200,317 195,305" fill="#00f5ff" filter="url(#shadowGlow)"/>
</svg>
