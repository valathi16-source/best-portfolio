<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="pyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#050c18"/>
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#pyBg)"/>

  <!-- Automation Pipeline Flow Chart -->
  <!-- Step 1: Input -->
  <rect x="50" y="130" width="100" height="70" rx="8" fill="#13233f" stroke="#00f5ff" stroke-width="2"/>
  <text x="75" y="160" fill="#00f5ff" font-family="monospace" font-size="11" font-weight="bold">SOURCE</text>
  <text x="65" y="180" fill="#94a3b8" font-family="monospace" font-size="9">Web Scrape</text>

  <!-- Arrow 1 -->
  <line x1="150" y1="165" x2="200" y2="165" stroke="#00f5ff" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="200,165 190,160 190,170" fill="#00f5ff"/>

  <!-- Step 2: Processing Engine (Gear) -->
  <rect x="210" y="110" width="170" height="110" rx="12" fill="#0f1d35" stroke="#a855f7" stroke-width="2"/>
  <circle cx="295" cy="155" r="30" fill="none" stroke="url(#gearGrad)" stroke-width="6" stroke-dasharray="10 5"/>
  <circle cx="295" cy="155" r="10" fill="#38bdf8"/>
  <text x="240" y="205" fill="#a855f7" font-family="monospace" font-size="10" font-weight="bold">PYTHON ASYNC ENGINE</text>

  <!-- Arrow 2 -->
  <line x1="380" y1="165" x2="430" y2="165" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="430,165 420,160 420,170" fill="#10b981"/>

  <!-- Step 3: Automated Actions / Dispatch -->
  <rect x="440" y="130" width="110" height="70" rx="8" fill="#13233f" stroke="#10b981" stroke-width="2"/>
  <text x="460" y="160" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">OUTPUT</text>
  <text x="450" y="180" fill="#94a3b8" font-family="monospace" font-size="9">Discord / DB</text>

  <!-- Terminal ticker at bottom -->
  <rect x="50" y="260" width="500" height="50" rx="6" fill="#070d1a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
  <text x="70" y="290" fill="#10b981" font-family="monospace" font-size="11">[CRON] 04:00 AM: Scraper finished. 142 items parsed. Zero errors.</text>
</svg>
