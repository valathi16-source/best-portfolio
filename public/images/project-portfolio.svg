<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bgGrad1)"/>
  
  <!-- Grid Matrix -->
  <g stroke="#00f5ff" stroke-width="0.5" stroke-opacity="0.15">
    <line x1="0" y1="50" x2="600" y2="50"/><line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/><line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/><line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="350"/><line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="300" y1="0" x2="300" y2="350"/><line x1="400" y1="0" x2="400" y2="350"/>
    <line x1="500" y1="0" x2="500" y2="350"/>
  </g>

  <!-- Cyber Window Frame -->
  <rect x="60" y="40" width="480" height="270" rx="12" fill="#0c132c" stroke="#00f5ff" stroke-width="2" stroke-opacity="0.5"/>
  <rect x="60" y="40" width="480" height="35" rx="12" fill="#131e42"/>
  <circle cx="85" cy="58" r="5" fill="#ef4444"/>
  <circle cx="102" cy="58" r="5" fill="#eab308"/>
  <circle cx="119" cy="58" r="5" fill="#10b981"/>
  <text x="145" y="62" fill="#94a3b8" font-family="monospace" font-size="11">valathi-portfolio // command-center</text>

  <!-- Interactive 3D Sphere / Hologram Centerpiece -->
  <circle cx="300" cy="180" r="60" fill="none" stroke="#00f5ff" stroke-width="2" stroke-opacity="0.8"/>
  <ellipse cx="300" cy="180" rx="60" ry="22" fill="none" stroke="#a855f7" stroke-width="2"/>
  <ellipse cx="300" cy="180" rx="22" ry="60" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="300" cy="180" r="15" fill="#00f5ff" fill-opacity="0.4"/>

  <!-- Left Stats Panel -->
  <rect x="90" y="100" width="130" height="180" rx="8" fill="#070c1e" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="105" y1="125" x2="195" y2="125" stroke="#00f5ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="105" y1="145" x2="175" y2="145" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="105" y1="165" x2="185" y2="165" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
  <rect x="105" y="195" width="100" height="25" rx="4" fill="#00f5ff" fill-opacity="0.2"/>
  <text x="115" y="212" fill="#00f5ff" font-family="monospace" font-size="10" font-weight="bold">STATUS: OK</text>

  <!-- Right Code Feed -->
  <rect x="380" y="100" width="130" height="180" rx="8" fill="#070c1e" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4"/>
  <text x="395" y="125" fill="#10b981" font-family="monospace" font-size="10">&gt; npm run dev</text>
  <text x="395" y="145" fill="#94a3b8" font-family="monospace" font-size="9">VITE v5.4 ready</text>
  <text x="395" y="165" fill="#00f5ff" font-family="monospace" font-size="9">&#9654; 3D perspective</text>
  <text x="395" y="185" fill="#a855f7" font-family="monospace" font-size="9">&#9654; Nova Chatbot</text>
  <text x="395" y="205" fill="#10b981" font-family="monospace" font-size="9">&#9654; Speech Ready</text>
  <text x="395" y="235" fill="#e2e8f0" font-family="monospace" font-size="9">&gt; _</text>
</svg>
